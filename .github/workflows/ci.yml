name: AI Service CI

on:
  push:
    branches: [main, dev, "codex/**", "feat/**", "fix/**", "loop/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/dev.lock
            requirements/runtime.lock
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Dependency consistency
        run: python -m pip check
      - name: Dependency lock integrity
        run: python scripts/verify/verify_dependency_locks.py
      - name: Compile sources
        run: python -m compileall -q src scripts tests
      - name: Clean Architecture + read-only static guard
        run: python scripts/verify/static_verify.py
      - name: Runtime config source/package integrity
        run: python scripts/verify/verify_runtime_config_sync.py
      - name: Knowledge schema contract integrity
        run: python scripts/knowledge/export_knowledge_schemas.py --verify
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Formatting
        run: ruff format --check src tests scripts
      - name: Mypy
        run: mypy src
      - name: Unit + contract + security regression
        run: pytest -q --cov=smartevent_ai --cov-report=term-missing --cov-fail-under=90
      - name: Historical v1.2 context integrity
        run: python scripts/verify/verify_contexts.py
      - name: Offline TEST_ONLY knowledge smoke
        run: python scripts/knowledge/knowledge_smoke.py --output artifacts/knowledge-ci
      - name: Historical reference contracts (not live integration)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q docs/contexts/v1.2/tests
      - name: Source artifact manifest
        run: python scripts/verify/source_manifest.py --verify
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Clean-directory wheel smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/release/wheel_smoke.py dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/dev.lock
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Audit locked runtime dependencies
        run: pip-audit --no-deps --disable-pip --timeout 30 -r requirements/runtime.lock
      - name: Audit optional RAG dependencies
        run: pip-audit --no-deps --disable-pip --timeout 30 -r requirements/rag.lock
      - name: Audit development and build tooling
        run: pip-audit --no-deps --disable-pip --timeout 30 -r requirements/dev.lock

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t smartevent-ai-service:ci .
      - name: Start container
        run: docker run -d --rm --name smartevent-ai-ci -p 18001:8001 smartevent-ai-service:ci
      - name: Wait for liveness and verify degraded readiness
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18001/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18001/health/live
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:18001/health/ready') as response:
              payload = json.load(response)
          assert payload['status'] == 'degraded', payload
          assert payload['business_tools_enabled'] == [], payload
          PY
      - name: Container logs on failure
        if: failure()
        run: docker logs smartevent-ai-ci || true
      - name: Stop container
        if: always()
        run: docker stop smartevent-ai-ci || true
