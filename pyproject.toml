[project]
name = "smartevent-ai-service"
version = "0.1.2"
description = "Read-only SmartEvent AI assistant Clean Architecture foundation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.48.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.16.0",
  "starlette==1.8.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0"
]
[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.14",
  "mypy==1.19.1",
  "pytest-asyncio==1.3.0",
  "types-jsonschema==4.26.0.20261006",
  "setuptools==82.0.1",
  "pip-audit==2.10.1",
  "uv==0.12.6"
]
[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartevent_ai = ["resources/*.yaml"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["docs/contexts", ".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "B008"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
mypy_path = "src"
files = ["src"]
exclude = "docs/contexts/"
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
