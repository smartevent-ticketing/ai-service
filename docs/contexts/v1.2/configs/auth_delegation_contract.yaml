version: '1.2'
status: PROPOSED_NEEDS_IMPLEMENTATION_AND_SECURITY_REVIEW
purpose: Customer-only read-only chatbot private queries
public_api:
  credential_mode: ANONYMOUS
  forward_user_authorization: false
  result_visibility: PUBLISHED_ONLY
private_api:
  enabled_by_default: false
  scope: CUSTOMER_SELF_ONLY
  identity_origin: VERIFIED_BFF_SESSION
  trusted_model_identity_fields: []
  allow_admin_role: false
  allow_service_role_to_impersonate_customer: false
  ownership_decision_authority: SPRING_BOOT_BACKEND
  path_id_is_authorization: false
  expose_raw_access_token_to_model: false
  require_authenticated_backend_validation: true
  allow_delegation_only_over_private_service_channel: true
  failure_action: DENY_AND_REQUEST_LOGIN_OR_SUPPORT
not_approved:
  - Copy refresh cookie from /api/auth into /api/chat by default
  - Decode JWT without verification and trust its roles
  - Call business API using an admin service token for buyer lookup
  - Trust userId generated by LLM or supplied in messages
repository_observation:
  nextjs_refresh_cookie_path: /api/auth
  access_token_storage: client_side_accessTokenStore
  effect: BFF private Chat auth requires explicit design and integration test
