version: '1.2'
business_access: READ_ONLY
enforcement:
  default: deny
  allowed_methods:
  - GET
  deny_mutations: true
  deny_unknown_tools: true
  deny_side_effect_get: true
  deny_redirects: true
  no_arbitrary_hosts_or_urls: true
  deny_encoded_path_variants: true
  max_response_bytes: 262144
  response_projection_mode: allowlist_only
  deny_raw_responses_in_model_context: true
  deny_request_retries_by_default: true
  private_tools_fail_closed_until_auth_proven: true
tools:
- name: search_events
  access: public
  method: GET
  endpoint: /api/v1/events
  mutation: false
  enabled: true
  requires_visibility_audit: false
  requires_authenticated_user: false
  response:
    source: spring_boot
    read_only: true
    envelope: ApiResponse.data
    result_shape: page
    projection: ALLOWLIST
    fields:
    - id
    - name
    - slug
    - venueName
    - city
    - startTime
    - endTime
    - status
    deny_unlisted_fields: true
    redact_fields:
    - qrCodeBase64
    - qrCode
    - ticketCode
    - token
    - tokenHash
    - accessToken
    - refreshToken
    - paymentUrl
    - customerNote
    - reason
    - evidenceReference
    - currentOwnerUserId
    - originalBuyerUserId
    - userId
    - organizerId
    - customerEmail
    - email
    - phone
    - bankCode
    - resolutionNote
    content_is_untrusted: true
    only_items_matching:
      status: PUBLISHED
  arguments_schema:
    type: object
    properties:
      q:
        type: string
        maxLength: 120
      city:
        type: string
        maxLength: 80
      categoryId: &id001
        type: string
        format: uuid
      page:
        type: integer
        minimum: 0
        maximum: 9
      size:
        type: integer
        minimum: 1
        maximum: 20
    required: []
    additionalProperties: false
  principal_scope: PUBLIC_ANONYMOUS
  credential_policy: NO_AUTHORIZATION_HEADER
  timeout_ms: 3000
  follow_redirects: false
  retry_policy: NONE
  max_results: 20
  requires_backend_visibility_guard: false
  visibility_policy: MUST_BE_PUBLISHED
  requires_runtime_gate: false
  response_schema:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      venueName:
        type: string
      city:
        type: string
      startTime:
        type: string
      endTime:
        type: string
      status:
        type: string
    additionalProperties: false
  disabled_reason: null
